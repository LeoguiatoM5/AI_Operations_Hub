# Stack local completa: a API e o n8n.
#
#   docker compose up -d --build --wait   sobe tudo e ESPERA ficar saudavel
#   docker compose logs -f api            acompanha
#   docker compose down                   derruba, preservando os dados
#
# **Use `--wait`.** Sem ele, `up -d` devolve o controle assim que o container INICIA, e
# nao quando a aplicacao comeca a atender. Nessa janela de um ou dois segundos a porta ja
# aceita conexao -- o proxy do Docker sobe junto com o container -- e o Python ainda nao
# escuta: o resultado e `curl: (52) Empty reply from server`, que parece defeito e e
# apenas pressa. Com `--wait`, o comando so retorna quando os healthchecks abaixo passam.
#
# Os dados ficam em ./data -- dentro do projeto, que vive no D:, e fora do Git.
#
# **Por que nao ha servico `chromadb`.** O roadmap previa um, e a decisao mudou com o
# codigo na frente: `ChromaVectorStore` usa o cliente EMBUTIDO (`PersistentClient`), que
# le e escreve um diretorio. Subir o Chroma como servico exigiria implementar o modo HTTP,
# e o ganho seria negativo para uma instancia unica -- acrescentaria uma porta de rede a
# uma dependencia que hoje tem uma CVE critica sem correcao (ver docs/security.md). O
# Protocol `VectorStore` mantem a porta aberta para quando houver mais de uma instancia.
#
# **PostgreSQL fica no perfil `postgres`**, e nao no padrao:
#
#   docker compose up -d --wait                        SQLite (padrao)
#   docker compose --profile postgres up -d --wait     PostgreSQL
#
# O padrao continua sendo SQLite porque um clone recem-baixado deve subir sem esperar um
# banco inicializar. O perfil existe para exercitar o caminho que a producao usaria -- e
# para provar que a promessa "trocar de banco e mudar a URL" e verdade, e nao folclore do
# README.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiops-api:local
    container_name: aiops-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      # Sem chave, o projeto sobe inteiro com provider deterministico -- e o que permite
      # `docker compose up` funcionar num clone limpo, sem configurar nada.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VECTOR_STORE: chroma
      CHROMA_PATH: /app/data/chroma
      # Com o perfil `postgres`, aponte para o servico pelo nome:
      #   DATABASE_URL=postgresql+asyncpg://aiops:aiops@postgres:5432/aiops
      # E a promessa do ED-016 sendo cobrada: trocar de banco e trocar esta linha.
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/app.db}
      CHECKPOINT_PATH: /app/data/checkpoints.db
      NOTIFIER: ${NOTIFIER:-memory}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      QUALITY_ENABLED: ${QUALITY_ENABLED:-false}
      # Dentro da rede do compose os servicos se enxergam pelo nome; `localhost` apontaria
      # para o proprio container da API.
      RESULT_CALLBACK_URL: ${RESULT_CALLBACK_URL:-http://n8n:5678/webhook/hub/resultado}
      LOG_FORMAT: json
    volumes:
      # Volume NOMEADO, e nao bind mount -- e a diferenca entre subir e nao subir.
      #
      # Com `./data:/app/data`, o SQLite quebra: `disk I/O error` ao criar o banco de
      # checkpoints. O bind mount do Docker Desktop no Windows atravessa uma camada de
      # traducao que nao entrega as garantias de bloqueio de arquivo que o SQLite exige --
      # e o sintoma nao acusa a causa.
      #
      # O preco e que os arquivos deixam de aparecer no Explorer. Para inspecionar:
      #   docker compose exec api ls -la /app/data
      #   docker run --rm -v ai_operations_hub_aiops-data:/d alpine ls -la /d
      - aiops-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://localhost:8000/health", timeout=4).status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  n8n:
    image: n8nio/n8n:latest
    container_name: aiops-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Sem HTTPS no ambiente local, o cookie seguro impediria o login na propria
      # interface. Fora do localhost isto precisa voltar a ser `true`.
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      # Silencia o aviso de permissao do arquivo de configuracao em bind mount no
      # Windows, onde o modo 0600 do Linux nao e representavel.
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      # Bind mount aqui, e nao volume nomeado -- assimetria deliberada. O n8n grava seu
      # SQLite sem sofrer com o bind mount, e manter os dados visiveis no host permite
      # exportar um workflow editado na interface para `workflows_n8n/` sem entrar no
      # container. Se este servico passar a apresentar erro de I/O, a solucao e a mesma
      # da API.
      - ./data/n8n:/home/node/.n8n
    extra_hosts:
      # Como o n8n alcanca algo rodando no HOST (uvicorn em desenvolvimento). Para falar
      # com a API do compose, use `http://api:8000`.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: aiops-postgres
    restart: unless-stopped
    # So sobe com `--profile postgres`. Sem isso, um clone recem-baixado esperaria um
    # banco inicializar para rodar algo que o SQLite atende em segundos.
    profiles: ["postgres"]
    ports:
      # 5433 no host, e nao 5432. Um PostgreSQL instalado na maquina ja escuta na 5432, e
      # o Windows permite que os dois abram a mesma porta -- sem erro. A conexao cai no
      # servico local, que nao conhece o banco `aiops`, e o sintoma e
      # `ConnectionDoesNotExistError: connection was closed in the middle of operation`,
      # que nao acusa a causa.
      #
      # A porta so existe para ferramenta do host (psql, cliente grafico, `alembic`). A
      # aplicacao no compose fala com `postgres:5432` pela rede interna, onde nao ha
      # disputa.
      - "5433:5432"
    environment:
      # Credencial de desenvolvimento local, deliberadamente trivial e deliberadamente
      # visivel: um segredo de verdade aqui daria a falsa impressao de que este compose
      # serve para producao. La, isto vira `secrets` do orquestrador.
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops
    volumes:
      - aiops-postgres:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` responde antes de o banco aceitar conexao de verdade em alguns casos;
      # o `-d` faz a checagem contra o banco que a aplicacao vai usar.
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # Dados da API (banco, checkpoints, indice do Chroma). Gerenciado pelo Docker, dentro do
  # sistema de arquivos da VM -- que e onde o SQLite funciona.
  aiops-data:
  aiops-postgres:
